name: Run distcheck

on:
  workflow_dispatch:
    inputs:
      config-flags:
        description: 'Configure flags to prepare the source directory'
        default: '--disable-lto'
        required: false
        type: string
  workflow_call:
    inputs:
      config-flags:
        description: 'Configure flags to prepare the source directory'
        default: '--disable-lto'
        required: false
        type: string

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Install prerequisites
      run:  |
        sudo apt-get update
        sudo apt-get -y install \
          build-essential \
          autoconf \
          automake \
          gengetopt \
          help2man \
          bison \
          flex \
          libtool \
          check \
          liblapacke \
          liblapacke-dev \
          graphviz \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-font-utils \
          texlive-fonts-recommended
    - name: Setup pixi
      uses: prefix-dev/setup-pixi@v0.11.1
      with:
        pixi-version: v0.83.0
    - name: Pixi prepare stage
      run: pixi run prepare
    - name: Pixi configure stage
      run: pixi run configure production -- ${{ inputs.config-flags }}
    - name: Pixi run distcheck
      run: pixi run distcheck

